name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser:
    name: Browser bundles (Chromium + Firefox)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build browser bundles
        shell: bash
        run: |
          npm --prefix browser install
          npm run build
          zip -r ruclaude-chromium-${{ github.ref_name || 'v1.0.0' }}.zip browser/dist/chromium
          zip -r ruclaude-firefox-${{ github.ref_name || 'v1.0.0' }}.zip browser/dist/firefox

      - name: Publish browser assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ruclaude-chromium-*.zip
            ruclaude-firefox-*.zip

  linux:
    name: Linux packages (.deb + .rpm)
    runs-on: ubuntu-latest
    needs: browser

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm

      - name: Build Linux packages
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION:-v1.0.0}"
          VERSION="${VERSION#v}"
          mkdir -p pkgroot/opt/ruclaude pkgroot/usr/bin pkgroot/usr/share/applications pkgroot/usr/share/pixmaps
          cp -R linux/. pkgroot/opt/ruclaude/
          cp linux/ruclaude.desktop pkgroot/usr/share/applications/ruclaude.desktop
          cp linux/assets/logo.png pkgroot/usr/share/pixmaps/ruclaude.png
          cat > pkgroot/usr/bin/ruclaude <<'EOF'
          #!/bin/sh
          exec /usr/bin/env python3 /opt/ruclaude/app.py "$@"
          EOF
          chmod 755 pkgroot/usr/bin/ruclaude
          chmod 755 pkgroot/opt/ruclaude/*.sh

          fpm -s dir -t deb -n ruclaude -v "$VERSION" -C pkgroot \
            --description "RuClaude privacy guard" \
            --license MIT \
            --url "https://github.com/auraxite/RuClaude" \
            --category net \
            --depends python3 --depends nftables --depends systemd \
            --architecture amd64 \
            -p "ruclaude_${VERSION}_amd64.deb"

          fpm -s dir -t rpm -n ruclaude -v "$VERSION" -C pkgroot \
            --description "RuClaude privacy guard" \
            --license MIT \
            --url "https://github.com/auraxite/RuClaude" \
            --category net \
            --depends python3 --depends nftables --depends systemd \
            --architecture x86_64 \
            -p "ruclaude-${VERSION}-1.x86_64.rpm"

      - name: Publish Linux assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ruclaude_*.deb
            ruclaude-*.rpm

  windows:
    name: Windows setup (.exe)
    runs-on: windows-latest
    needs: browser

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build Windows app
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $version = if ($env:VERSION) { $env:VERSION.TrimStart('v') } else { '1.0.0' }
          New-Item -ItemType Directory -Force -Path dist/windows/publish | Out-Null
          dotnet publish windows/RuClaude.App/RuClaude.App.csproj -c Release -r win-x64 --self-contained true -o dist/windows/publish
          dotnet publish windows/RuClaude.Service/RuClaude.Service.csproj -c Release -r win-x64 --self-contained true -o dist/windows/service

          $repo = (Get-Location).Path
          $iss = @"
          [Setup]
          AppName=RuClaude
          AppVersion=$version
          DefaultDirName={commonpf64}\RuClaude
          DefaultGroupName=RuClaude
          OutputDir=$repo
          OutputBaseFilename=ruclaude-windows-$version
          Compression=lzma2
          SolidCompression=yes
          PrivilegesRequired=admin

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Files]
          Source: "$repo\dist\windows\publish\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs
          Source: "$repo\dist\windows\service\*"; DestDir: "{app}\Service"; Flags: recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\RuClaude"; Filename: "{app}\RuClaude.exe"

          [Run]
          Filename: "{app}\RuClaude.exe"; Description: "Run RuClaude"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content -Path dist/windows/setup.iss -Value $iss -Encoding UTF8

          $inno = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $inno '/Sbyparam=value' '/Q' (Join-Path $repo 'dist/windows/setup.iss')
          Get-ChildItem -Path $repo -Filter 'ruclaude-windows-*.exe' | Select-Object -ExpandProperty FullName

      - name: Publish Windows asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ruclaude-windows-*.exe
