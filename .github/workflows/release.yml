name: Independent releases

on:
  push:
    tags:
      - 'browser/v*'
      - 'android/v*'
      - 'windows/v*'
      - 'linux/v*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.check.outputs.component }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^(browser|android|windows|linux)/v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo 'Invalid component version tag'; exit 1; }
          component="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"
          echo "component=$component" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Require a change to this component since its last release.
          # Ignore workflow / README-only changes, which should not bump app versions.
          mapfile -t prior < <(git tag -l "$component/v*" --sort=-v:refname | grep -v -Fx "$RELEASE_TAG" || true)
          if (( ${#prior[@]} )); then
            previous="${prior[0]}"
            # Refuse out-of-order or duplicate component versions.
            if [[ "$(printf '%s\n%s\n' "$RELEASE_TAG" "$previous" | sort -V | tail -1)" != "$RELEASE_TAG" ]]; then
              echo "Version must be newer than $previous" >&2; exit 1
            fi
            paths=("$component/")
            if [[ "$component" == windows || "$component" == linux ]]; then
              paths=("desktop/src/" "desktop/assets/" "desktop/CMakeLists.txt" "desktop/$component/")
            fi
            if git diff --quiet "$previous" "$RELEASE_TAG" -- "${paths[@]}"; then
              echo "No changes to $component/ since $previous; refusing version bump" >&2
              exit 1
            fi
          fi
          if [[ "$component" == browser ]]; then
            node -e 'const p=require("./browser/package.json"); const m=require("./browser/manifest.json"); if(p.version!==process.argv[1]||m.version!==process.argv[1]) process.exit(1)' "$version" || { echo 'Browser manifest/package versions do not match tag'; exit 1; }
          fi
          if [[ "$component" == android ]]; then
            grep -Eq "versionName ['\"]${version//./\.}['\"]" android/app/build.gradle || { echo 'Android versionName does not match tag'; exit 1; }
          fi

  browser:
    if: needs.validate.outputs.component == 'browser'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build browser extensions
        shell: bash
        run: |
          npm --prefix browser install
          npm run build
          npm test
          (cd browser/dist && zip -r "$GITHUB_WORKSPACE/ruclaude-chromium-${{ needs.validate.outputs.version }}.zip" chromium)
          (cd browser/dist && zip -r "$GITHUB_WORKSPACE/ruclaude-firefox-${{ needs.validate.outputs.version }}.zip" firefox)
      - uses: softprops/action-gh-release@v2
        with:
          name: Browser v${{ needs.validate.outputs.version }}
          files: |
            ruclaude-chromium-*.zip
            ruclaude-firefox-*.zip

  android:
    if: needs.validate.outputs.component == 'android'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build installable debug-signed APK
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ruclaude-android-${{ needs.validate.outputs.version }}-debug.apk"
      - uses: softprops/action-gh-release@v2
        with:
          name: Android v${{ needs.validate.outputs.version }} (debug-signed)
          prerelease: true
          files: ruclaude-android-*-debug.apk

  windows:
    if: needs.validate.outputs.component == 'windows'
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S desktop -B desktop/build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build desktop/build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktop/build/Release/RuClaude.exe, desktop/build/Release/RuClaudeService.exe dist/
          windeployqt --release --no-translations dist/RuClaude.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item desktop/windows/Install.cmd,desktop/windows/Uninstall.cmd dist/
          Compress-Archive -Path dist/* -DestinationPath "ruclaude-windows-x64-${{ needs.validate.outputs.version }}.zip"
      - uses: softprops/action-gh-release@v2
        with:
          name: Windows v${{ needs.validate.outputs.version }} (Qt 6)
          prerelease: true
          files: ruclaude-windows-x64-*.zip

  linux:
    if: needs.validate.outputs.component == 'linux'
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build qt6-base-dev libqt6network6 libqt6widgets6 nftables
      - name: Build Linux Qt binaries
        run: |
          cmake -S desktop -B desktop/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build desktop/build --parallel
          mkdir -p staging/ruclaude-linux/prebuilt
          cp desktop/build/RuClaude desktop/build/RuClaudeService staging/ruclaude-linux/prebuilt/
          cp -a desktop staging/ruclaude-linux/
          rm -rf staging/ruclaude-linux/desktop/build
          tar -C staging -czf "ruclaude-linux-x86_64-${{ needs.validate.outputs.version }}.tar.gz" ruclaude-linux
      - uses: softprops/action-gh-release@v2
        with:
          name: Linux v${{ needs.validate.outputs.version }} (Qt 6)
          prerelease: true
          files: ruclaude-linux-x86_64-*.tar.gz
